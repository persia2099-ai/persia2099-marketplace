name: Persia 2099 Escrow Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    container: solanafoundation/anchor:v0.32.1
    env:
      RUSTUP_TOOLCHAIN: 1.89.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Devnet deployer
        shell: bash
        env:
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
        run: |
          set -e
          if [ -z "$DEPLOYER_PRIVATE_KEY" ]; then
            echo "Missing DEPLOYER_PRIVATE_KEY GitHub Actions secret."
            exit 1
          fi
          rm -f /tmp/deployer.json
          python3 - <<'PY'
          import json, os, re, sys
          s = os.environ["DEPLOYER_PRIVATE_KEY"].strip().strip('"\'')
          if len(s.split()) in (12, 24):
              print("ERROR: recovery phrase is not accepted here. Use Phantom Export Private Key.")
              sys.exit(1)
          s = ''.join(s.split())
          raw = None
          try:
              candidate = json.loads(s)
              if isinstance(candidate, list) and len(candidate) == 64 and all(isinstance(x, int) and 0 <= x <= 255 for x in candidate):
                  raw = bytes(candidate)
          except Exception:
              pass
          if raw is None and re.fullmatch(r'(?:0x)?[0-9a-fA-F]{128}', s):
              raw = bytes.fromhex(s[2:] if s.startswith('0x') else s)
          if raw is None:
              alphabet = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz"
              index = {c:i for i,c in enumerate(alphabet)}
              n = 0
              for c in s:
                  if c not in index:
                      raise SystemExit("Invalid Phantom private-key format.")
                  n = n * 58 + index[c]
              raw = b'\x00' * (len(s) - len(s.lstrip('1'))) + n.to_bytes((n.bit_length()+7)//8, 'big')
          if len(raw) != 64:
              raise SystemExit("The secret must decode to a 64-byte Solana secret key.")
          with open('/tmp/deployer.json', 'w') as f:
              json.dump(list(raw), f)
          PY
          chmod 600 /tmp/deployer.json
          solana config set --url https://api.devnet.solana.com
          solana config set --keypair /tmp/deployer.json
          echo "Deployer address:"
          solana address
          echo "Deployer balance:"
          solana balance

      - name: Configure stable program keypair
        shell: bash
        env:
          PROGRAM_KEYPAIR: ${{ secrets.PROGRAM_KEYPAIR }}
        run: |
          set -e
          if [ -z "$PROGRAM_KEYPAIR" ]; then
            echo "Missing PROGRAM_KEYPAIR GitHub Actions secret."
            exit 1
          fi
          mkdir -p escrow/target/deploy
          python3 - <<'PY'
          import json, os, re, sys
          s = os.environ["PROGRAM_KEYPAIR"].strip().strip('"\'')
          raw = None
          try:
              candidate = json.loads(s)
              if isinstance(candidate, list) and len(candidate) == 64 and all(isinstance(x, int) and 0 <= x <= 255 for x in candidate):
                  raw = bytes(candidate)
          except Exception:
              pass
          if raw is None and re.fullmatch(r'(?:0x)?[0-9a-fA-F]{128}', s):
              raw = bytes.fromhex(s[2:] if s.startswith('0x') else s)
          if raw is None:
              alphabet = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz"
              index = {c:i for i,c in enumerate(alphabet)}
              n = 0
              for c in s:
                  if c not in index:
                      raise SystemExit("Invalid PROGRAM_KEYPAIR format.")
                  n = n * 58 + index[c]
              raw = b'\x00' * (len(s) - len(s.lstrip('1'))) + n.to_bytes((n.bit_length()+7)//8, 'big')
          if len(raw) != 64:
              raise SystemExit("PROGRAM_KEYPAIR must decode to a 64-byte Solana secret key.")
          with open('escrow/target/deploy/persia2099_escrow-keypair.json', 'w') as f:
              json.dump(list(raw), f)
          PY
          chmod 600 escrow/target/deploy/persia2099_escrow-keypair.json
          PROGRAM_ID=$(solana-keygen pubkey escrow/target/deploy/persia2099_escrow-keypair.json)
          echo "Stable Program ID: $PROGRAM_ID"
          test "$PROGRAM_ID" = "4nwK6KMgGFAi1j363GSyi1vMfwQaL2iT5vELJJY6ZuHo" || {
            echo "PROGRAM_KEYPAIR does not match the expected stable Program ID."
            exit 1
          }

      - name: Configure program id
        working-directory: escrow
        shell: bash
        run: |
          set -e
          PROGRAM_ID=$(solana-keygen pubkey target/deploy/persia2099_escrow-keypair.json)
          python3 - "$PROGRAM_ID" <<'PY'
          import pathlib, re, sys
          pid = sys.argv[1]

          lib = pathlib.Path("programs/persia2099-escrow/src/lib.rs")
          text = lib.read_text()
          text, count = re.subn(r'declare_id!\("[^"]+"\)', f'declare_id!("{pid}")', text, count=1)
          if count != 1:
              raise SystemExit("declare_id! not found in lib.rs")
          lib.write_text(text)

          cfg = pathlib.Path("Anchor.toml")
          text = cfg.read_text()
          text, count = re.subn(r'(persia2099_escrow\s*=\s*")[^"]+(")', rf'\g<1>{pid}\g<2>', text, count=1)
          if count != 1:
              raise SystemExit("persia2099_escrow entry not found in Anchor.toml")
          cfg.write_text(text)
          PY

      - name: Configure Rust toolchain
        shell: bash
        run: |
          unset RUSTUP_TOOLCHAIN
          rustup toolchain install 1.89.0 --profile minimal
          rustup default 1.89.0
          rustup run 1.89.0 rustc --version
          rustup run 1.89.0 cargo --version
          cargo build-sbf --version

      - name: Prepare locked Rust dependencies
        working-directory: escrow
        shell: bash
        run: |
          set -e
          unset RUSTUP_TOOLCHAIN
          rustup run 1.89.0 cargo generate-lockfile
          rustup run 1.89.0 cargo update -p blake3 --precise 1.8.2
          rustup run 1.89.0 cargo update -p constant_time_eq --precise 0.3.1
          rustup run 1.89.0 cargo update -p base64ct --precise 1.7.3
          echo "Locked dependency versions prepared."

      - name: Build escrow program
        working-directory: escrow
        shell: bash
        run: |
          export RUSTUP_TOOLCHAIN=1.89.0
          cargo build-sbf --tools-version v1.52

      - name: Deploy escrow to Devnet
        working-directory: escrow
        shell: bash
        run: |
          export RUSTUP_TOOLCHAIN=1.89.0
          solana program deploy target/deploy/persia2099_escrow.so             --program-id target/deploy/persia2099_escrow-keypair.json             --url https://api.devnet.solana.com             --keypair /tmp/deployer.json

      - name: Verify deployed program
        working-directory: escrow
        shell: bash
        run: |
          set -e
          PROGRAM_ID=$(solana address -k target/deploy/persia2099_escrow-keypair.json)
          echo "Persia 2099 Escrow Program ID: $PROGRAM_ID"
          solana program show "$PROGRAM_ID" --url https://api.devnet.solana.com
          echo "Devnet Explorer: https://explorer.solana.com/address/$PROGRAM_ID?cluster=devnet"
