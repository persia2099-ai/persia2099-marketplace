name: Prepare Stable Escrow Program Keypair

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate stable Solana program keypair
        shell: bash
        run: |
          set -e
          mkdir -p out
          python3 - <<'PY'
          import secrets
          open("/tmp/seed.bin","wb").write(secrets.token_bytes(32))
          PY
          node - <<'NODE'
          const fs = require("fs");
          const crypto = require("crypto");
          const alphabet = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz";
          const seed = fs.readFileSync("/tmp/seed.bin");
          const der = Buffer.concat([
            Buffer.from("302e020100300506032b657004220420","hex"),
            seed
          ]);
          const key = crypto.createPrivateKey({key: der, format: "der", type: "pkcs8"});
          const pubDer = crypto.createPublicKey(key).export({format:"der",type:"spki"});
          const publicKey = pubDer.subarray(pubDer.length-32);
          const secret = Buffer.concat([seed, publicKey]);
          fs.writeFileSync("out/PROGRAM_KEYPAIR.json", JSON.stringify(Array.from(secret)));
          let n = BigInt("0x" + publicKey.toString("hex"));
          let id = "";
          while (n > 0n) { id = alphabet[Number(n % 58n)] + id; n /= 58n; }
          let leading = 0;
          for (const b of publicKey) { if (b === 0) leading++; else break; }
          id = "1".repeat(leading) + id;
          console.log("STABLE PROGRAM ID:", id);
          console.log("Keypair file created as workflow artifact.");
          console.log("NEVER commit PROGRAM_KEYPAIR.json or paste its contents into chat.");
          NODE
          chmod 600 out/PROGRAM_KEYPAIR.json

      - name: Upload keypair artifact
        uses: actions/upload-artifact@v4
        with:
          name: stable-program-keypair
          path: out/PROGRAM_KEYPAIR.json
          retention-days: 1
