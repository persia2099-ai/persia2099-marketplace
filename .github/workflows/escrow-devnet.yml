name: Build and Deploy Persia 2099 Escrow

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    container: solanafoundation/anchor:v0.31.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Devnet deployer
        shell: bash
        env:
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
        run: |
          if [ -z "$DEPLOYER_PRIVATE_KEY" ]; then
            echo "Missing DEPLOYER_PRIVATE_KEY GitHub Actions secret."
            exit 1
          fi

          python3 - <<'PY'
          import json, os, sys

          s = os.environ["DEPLOYER_PRIVATE_KEY"].strip()
          s = s.strip('"\'')
          s = ''.join(s.split())

          for prefix in ("PrivateKey:", "PrivateKey=", "privatekey:", "privatekey="):
              if s.startswith(prefix):
                  s = s[len(prefix):]
                  break

          raw = None

          # Support Phantom values copied as a JSON byte array.
          try:
              candidate = json.loads(s)
              if isinstance(candidate, list) and all(isinstance(x, int) and 0 <= x <= 255 for x in candidate):
                  if len(candidate) == 64:
                      raw = bytes(candidate)
          except Exception:
              pass

          # Otherwise decode the normal Base58 Solana secret-key format.
          if raw is None:
              alphabet = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz"
              indexes = {ch: i for i, ch in enumerate(alphabet)}
              n = 0
              for pos, ch in enumerate(s):
                  if ch not in indexes:
                      print(f"Invalid Base58 character at position {pos}: {repr(ch)} (codepoint {ord(ch)})")
                      print("Use Phantom -> Copy Private Key, and paste the complete value into the GitHub Secret.")
                      sys.exit(1)
                  n = n * 58 + indexes[ch]

              raw = n.to_bytes((n.bit_length() + 7) // 8, "big")
              leading = 0
              for ch in s:
                  if ch == "1":
                      leading += 1
                  else:
                      break
              raw = b"\x00" * leading + raw

          print(f"Decoded key length: {len(raw)} bytes")
          if len(raw) != 64:
              print("The GitHub Secret is not a 64-byte Solana secret key.")
              print("Replace DEPLOYER_PRIVATE_KEY with the value from Phantom -> Copy Private Key.")
              sys.exit(1)

          with open("/tmp/deployer.json", "w") as f:
              json.dump(list(raw), f)
          PY

          chmod 600 /tmp/deployer.json
          solana config set --url https://api.devnet.solana.com
          solana config set --keypair /tmp/deployer.json
          echo "Deployer address:"
          solana address
          echo "Deployer balance:"
          solana balance

      - name: Generate program keypair
        shell: bash
        run: |
          mkdir -p escrow/target/deploy
          solana-keygen new --no-bip39-passphrase --silent --outfile escrow/target/deploy/persia2099_escrow-keypair.json

      - name: Sync program id
        working-directory: escrow
        run: anchor keys sync

      - name: Build escrow program
        working-directory: escrow
        run: anchor build

      - name: Deploy escrow to Devnet
        working-directory: escrow
        run: anchor deploy --provider.cluster devnet --provider.wallet /tmp/deployer.json

      - name: Print deployed program id
        working-directory: escrow
        run: |
          echo "Persia 2099 Escrow Program ID:"
          anchor keys list
          PROGRAM_ID=$(anchor keys list | awk '/persia2099_escrow/ {print $2}')
          echo "Devnet Explorer: https://explorer.solana.com/address/${PROGRAM_ID}?cluster=devnet"
