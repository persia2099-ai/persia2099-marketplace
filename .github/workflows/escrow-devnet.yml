name: Build and Deploy Persia 2099 Escrow

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    container: solanafoundation/anchor:v0.31.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Devnet deployer
        shell: bash
        env:
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
        run: |
          if [ -z "$DEPLOYER_PRIVATE_KEY" ]; then
            echo "Missing DEPLOYER_PRIVATE_KEY GitHub Actions secret."
            exit 1
          fi

          rm -f /tmp/deployer.json

          python3 -c 'import json,os,re,sys; s=os.environ["DEPLOYER_PRIVATE_KEY"].strip().strip(chr(34)+chr(39)); words=s.split(); sys.exit("RECOVERY" if len(words) in (12,24) else 0)' 2>/dev/null || rc=$?
          if [ "${rc:-0}" = "RECOVERY" ]; then
            echo "ERROR: DEPLOYER_PRIVATE_KEY contains a recovery phrase."
            echo "Use Phantom -> Settings -> Security & Privacy -> Export Private Key for the dedicated Devnet deployer wallet."
            exit 1
          fi

          python3 -c 'import json,os,re,sys; s=os.environ["DEPLOYER_PRIVATE_KEY"].strip().strip(chr(34)+chr(39)); s="".join(s.split()); labels=("PrivateKey:","PrivateKey=","privatekey:","privatekey=","PrivateKey","privatekey","SecretKey:","SecretKey=","secretkey:","secretkey="); [globals().__setitem__("s",s[len(p):].lstrip(":=")) for p in labels if s.startswith(p)]; raw=None; exec("""\ntry:\n candidate=json.loads(s)\n if isinstance(candidate,list) and len(candidate)==64 and all(isinstance(x,int) and 0<=x<=255 for x in candidate): raw=bytes(candidate)\nexcept Exception: pass\n"""); raw = raw if raw is not None else (bytes.fromhex(s[2:] if s.startswith("0x") else s) if re.fullmatch(r"(?:0x)?[0-9a-fA-F]{128}",s) else None);\nif raw is None:\n alphabet="123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz"; idx={c:i for i,c in enumerate(alphabet)}; n=0\n for c in s:\n  if c not in idx: raise SystemExit("Invalid private-key format. Use Phantom -> Copy Private Key, not the recovery phrase.")\n  n=n*58+idx[c]\n raw=n.to_bytes((n.bit_length()+7)//8,"big")\n raw=b"\\0"*(len(s)-len(s.lstrip("1")))+raw\nif len(raw)!=64: raise SystemExit("The GitHub Secret does not contain a valid 64-byte Solana secret key.")\njson.dump(list(raw),open("/tmp/deployer.json","w"))'

          if [ ! -f /tmp/deployer.json ]; then
            echo "No deployer keypair was created."
            exit 1
          fi

          chmod 600 /tmp/deployer.json
          solana config set --url https://api.devnet.solana.com
          solana config set --keypair /tmp/deployer.json
          echo "Deployer address:"
          solana address
          echo "Deployer balance:"
          solana balance

      - name: Generate program keypair
        shell: bash
        run: |
          mkdir -p escrow/target/deploy
          solana-keygen new --no-bip39-passphrase --silent --outfile escrow/target/deploy/persia2099_escrow-keypair.json

      - name: Sync program id
        working-directory: escrow
        run: anchor keys sync

      - name: Build escrow program
        working-directory: escrow
        run: anchor build

      - name: Deploy escrow to Devnet
        working-directory: escrow
        run: anchor deploy --provider.cluster devnet --provider.wallet /tmp/deployer.json

      - name: Print deployed program id
        working-directory: escrow
        run: |
          echo "Persia 2099 Escrow Program ID:"
          anchor keys list
          PROGRAM_ID=$(anchor keys list | awk '/persia2099_escrow/ {print $2}')
          echo "Devnet Explorer: https://explorer.solana.com/address/${PROGRAM_ID}?cluster=devnet"
