name: Build and Deploy Persia 2099 Escrow

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    container: solanafoundation/anchor:v0.31.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Devnet deployer
        shell: bash
        env:
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
        run: |
          if [ -z "$DEPLOYER_PRIVATE_KEY" ]; then
            echo "Missing DEPLOYER_PRIVATE_KEY GitHub Actions secret."
            exit 1
          fi

          rm -f /tmp/deployer.json

          python3 - <<'PY'
          import json, os, re
          s = os.environ["DEPLOYER_PRIVATE_KEY"].strip().strip('"\'')
          words = s.split()
          if len(words) in (12, 24):
              with open("/tmp/deployer-recovery.txt", "w") as f:
                  f.write(" ".join(words) + "\n")
              print(f"Detected a {len(words)}-word recovery phrase.")
          else:
              s = ''.join(s.split())
              labels = ("PrivateKey:", "PrivateKey=", "privatekey:", "privatekey=", "PrivateKey", "privatekey", "SecretKey:", "SecretKey=", "secretkey:", "secretkey=")
              for prefix in labels:
                  if s.startswith(prefix):
                      s = s[len(prefix):].lstrip(':=')
                      break
              raw = None
              try:
                  candidate = json.loads(s)
                  if isinstance(candidate, list) and len(candidate) == 64 and all(isinstance(x, int) and 0 <= x <= 255 for x in candidate):
                      raw = bytes(candidate)
              except Exception:
                  pass
              if raw is None and re.fullmatch(r"(?:0x)?[0-9a-fA-F]{128}", s):
                  raw = bytes.fromhex(s[2:] if s.startswith("0x") else s)
              if raw is None:
                  alphabet = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz"
                  indexes = {ch: i for i, ch in enumerate(alphabet)}
                  n = 0
                  for pos, ch in enumerate(s):
                      if ch not in indexes:
                          print("Invalid private-key format. Use Phantom -> Copy Private Key, not the recovery phrase.")
                          raise SystemExit(1)
                      n = n * 58 + indexes[ch]
                  raw = n.to_bytes((n.bit_length() + 7) // 8, "big")
                  leading = len(s) - len(s.lstrip("1"))
                  raw = b"\x00" * leading + raw
              if len(raw) != 64:
                  print("The GitHub Secret does not contain a valid 64-byte Solana secret key.")
                  raise SystemExit(1)
              with open("/tmp/deployer.json", "w") as f:
                  json.dump(list(raw), f)
          PY

          if [ -f /tmp/deployer-recovery.txt ]; then
            npm install --no-save bip39 micro-ed25519-hdkey @solana/web3.js >/dev/null 2>&1
            export DEPLOYER_MNEMONIC="$(cat /tmp/deployer-recovery.txt)"
            node --input-type=module <<'NODE'
            import { mnemonicToSeedSync } from 'bip39';
            import { HDKey } from 'micro-ed25519-hdkey';
            import { Keypair } from '@solana/web3.js';
            import fs from 'fs';
            const mnemonic = process.env.DEPLOYER_MNEMONIC.trim();
            const seed = mnemonicToSeedSync(mnemonic);
            const hd = HDKey.fromMasterSeed(seed);
            const child = hd.derive("m/44'/501'/0'/0'");
            const keypair = Keypair.fromSeed(child.privateKey);
            fs.writeFileSync('/tmp/deployer.json', JSON.stringify(Array.from(keypair.secretKey)));
            console.log('Recovered Phantom-style Solana account successfully.');
            NODE
            unset DEPLOYER_MNEMONIC
            rm -f /tmp/deployer-recovery.txt
          fi

          if [ ! -f /tmp/deployer.json ]; then
            echo "No deployer keypair was created."
            exit 1
          fi

          chmod 600 /tmp/deployer.json
          solana config set --url https://api.devnet.solana.com
          solana config set --keypair /tmp/deployer.json
          echo "Deployer address:"
          solana address
          echo "Deployer balance:"
          solana balance

      - name: Generate program keypair
        shell: bash
        run: |
          mkdir -p escrow/target/deploy
          solana-keygen new --no-bip39-passphrase --silent --outfile escrow/target/deploy/persia2099_escrow-keypair.json

      - name: Sync program id
        working-directory: escrow
        run: anchor keys sync

      - name: Build escrow program
        working-directory: escrow
        run: anchor build

      - name: Deploy escrow to Devnet
        working-directory: escrow
        run: anchor deploy --provider.cluster devnet --provider.wallet /tmp/deployer.json

      - name: Print deployed program id
        working-directory: escrow
        run: |
          echo "Persia 2099 Escrow Program ID:"
          anchor keys list
          PROGRAM_ID=$(anchor keys list | awk '/persia2099_escrow/ {print $2}')
          echo "Devnet Explorer: https://explorer.solana.com/address/${PROGRAM_ID}?cluster=devnet"
