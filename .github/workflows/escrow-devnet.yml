name: Build and Deploy Persia 2099 Escrow

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    container: solanafoundation/anchor:v0.31.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Devnet deployer
        shell: bash
        env:
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
        run: |
          set -e
          if [ -z "$DEPLOYER_PRIVATE_KEY" ]; then
            echo "Missing DEPLOYER_PRIVATE_KEY GitHub Actions secret."
            exit 1
          fi

          rm -f /tmp/deployer.json

          python3 - <<'PY'
import json, os, re, sys
s = os.environ["DEPLOYER_PRIVATE_KEY"].strip().strip('"\'')
if len(s.split()) in (12, 24):
    print("ERROR: DEPLOYER_PRIVATE_KEY contains a recovery phrase.")
    print("Use Phantom -> Settings -> Security & Privacy -> Export Private Key for the dedicated Devnet deployer wallet.")
    sys.exit(1)

s = ''.join(s.split())
for label in ("PrivateKey:", "PrivateKey=", "privatekey:", "privatekey=", "PrivateKey", "privatekey", "SecretKey:", "SecretKey=", "secretkey:", "secretkey="):
    if s.startswith(label):
        s = s[len(label):].lstrip(':=')
        break

raw = None
try:
    candidate = json.loads(s)
    if isinstance(candidate, list) and len(candidate) == 64 and all(isinstance(x, int) and 0 <= x <= 255 for x in candidate):
        raw = bytes(candidate)
except Exception:
    pass

if raw is None and re.fullmatch(r'(?:0x)?[0-9a-fA-F]{128}', s):
    raw = bytes.fromhex(s[2:] if s.startswith('0x') else s)

if raw is None:
    alphabet = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz"
    index = {c:i for i,c in enumerate(alphabet)}
    n = 0
    for c in s:
        if c not in index:
            raise SystemExit("Invalid private-key format. Use Phantom -> Copy Private Key, not the recovery phrase.")
        n = n * 58 + index[c]
    raw = b'\x00' * (len(s) - len(s.lstrip('1'))) + n.to_bytes((n.bit_length()+7)//8, 'big')

if len(raw) != 64:
    raise SystemExit("The GitHub Secret does not contain a valid 64-byte Solana secret key.")

with open('/tmp/deployer.json', 'w') as f:
    json.dump(list(raw), f)
PY

          chmod 600 /tmp/deployer.json
          solana config set --url https://api.devnet.solana.com
          solana config set --keypair /tmp/deployer.json
          echo "Deployer address:"
          solana address
          echo "Deployer balance:"
          solana balance

      - name: Generate program keypair
        shell: bash
        run: |
          mkdir -p escrow/target/deploy
          solana-keygen new --no-bip39-passphrase --silent --outfile escrow/target/deploy/persia2099_escrow-keypair.json

      - name: Sync program id
        working-directory: escrow
        run: anchor keys sync

      - name: Build escrow program
        working-directory: escrow
        run: anchor build

      - name: Deploy escrow to Devnet
        working-directory: escrow
        run: anchor deploy --provider.cluster devnet --provider.wallet /tmp/deployer.json

      - name: Print deployed program id
        working-directory: escrow
        run: |
          echo "Persia 2099 Escrow Program ID:"
          anchor keys list
          PROGRAM_ID=$(anchor keys list | awk '/persia2099_escrow/ {print $2}')
          echo "Devnet Explorer: https://explorer.solana.com/address/${PROGRAM_ID}?cluster=devnet"
